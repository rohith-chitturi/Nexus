[project]
name = "nexus"
version = "0.1.0"
description = "NEXUS — Data Evolution & Intelligence Engine"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "duckdb>=1.0.0",
    "polars>=0.20.0",
    "pyarrow>=15.0.0",
    "redis>=5.0.0",
    "langgraph>=0.0.25",
    "confluent-kafka>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

[tool.hatch.build.targets.wheel]
packages = [
    "apps",
    "agents",
    "data_engine",
    "lineage",
    "evolution",
    "vector",
    "sandbox",
    "evaluation",
]
